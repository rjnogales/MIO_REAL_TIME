<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Auditoría SIC MIO</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#005ca9">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
    <div class="session-row">
        <select id="estacionSelect" aria-label="Estación"></select>
        <select id="plataformaSelect" aria-label="Plataforma"></select>
        <button id="toggleSessionBtn" type="button">Iniciar captura</button>
    </div>
    <div id="sessionStatus" class="session-status"></div>
    <div id="relojEstado" class="reloj-estado"></div>
    <div id="pollEstado" class="poll-estado"></div>
    <div id="alertBanner" class="alert-banner hidden"></div>
    <nav class="tabs">
        <button class="tab-btn active" data-tab="principal" type="button">Monitoreo</button>
        <button class="tab-btn" data-tab="auditoria" type="button">Auditoría</button>
    </nav>
</header>

<main>
    <section id="tab-principal" class="tab-panel active">
        <div id="sessionsArchive" class="sessions-archive hidden"></div>
        <div id="cards" class="cards"></div>
    </section>

    <section id="tab-auditoria" class="tab-panel">
        <button id="btnVolverMonitoreo" type="button" class="btn-secundario">&larr; Volver a monitoreo</button>
        <p id="auditEmpty" class="muted">Selecciona un bus desde Monitoreo (botón "Auditar" en la tarjeta de la ruta) para empezar.</p>
        <div id="auditCard" class="card-ruta hidden"></div>
        <div id="auditButtons" class="audit-buttons hidden">
            <button id="btnMarcarHora" type="button" class="btn-grande">Marcar llegada (hora)</button>
            <div class="identidad-row">
                <button id="btnIdentidadSi" type="button" class="btn-grande btn-ok">Identidad: Sí coincide</button>
                <button id="btnIdentidadNo" type="button" class="btn-grande btn-no">Identidad: No coincide</button>
            </div>
            <div id="busFisicoWrap" class="bus-fisico-wrap hidden">
                <label for="numeroBusFisico">Número físico del bus visto:</label>
                <input type="text" id="numeroBusFisico" inputmode="numeric" placeholder="ej. MC 21035">
                <button id="btnGuardarBusFisico" type="button">Guardar</button>
            </div>
        </div>
    </section>
</main>

<dialog id="startSessionDialog">
    <form method="dialog" id="startSessionForm">
        <h2>Iniciar sesión de auditoría</h2>
        <p>Estación: <strong id="startEstacionLabel"></strong></p>
        <label for="auditorInput">Nombre del auditor:</label>
        <input type="text" id="auditorInput" required autocomplete="off">
        <menu>
            <button type="submit" value="cancel">Cancelar</button>
            <button type="submit" value="default" id="confirmStartBtn">Iniciar</button>
        </menu>
    </form>
</dialog>

<script src="js/vehiculos.js"></script>
<script src="data/paradas.js"></script>
<script src="js/reloj.js"></script>
<script src="js/api.js"></script>
<script src="js/logic.js"></script>
<script src="js/storage.js"></script>
<script src="js/csv.js"></script>
<script src="js/app.js"></script>
</body>
</html>
